[project]
name = "careagent"
version = "0.1.0"
description = "Oracle-backed telecom customer care agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1", "oracledb>=3,<4", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "langgraph>=1,<2", "litellm>=1.80,<2",
  "ag-ui-protocol>=0.1.10,<1", "argon2-cffi>=23.1",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/careagent"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["oracle: requires TEST_ORACLE_URL pointing to a disposable Oracle schema"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
