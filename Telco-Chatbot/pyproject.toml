[project]
name = "telora"
version = "0.1.0"
description = "Telora customer support chatbot powered by OpenAI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "openai>=1.0.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
